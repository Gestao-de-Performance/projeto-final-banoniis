<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site Locação Máquinas">
    <title>Projeto Final</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </head>
<body>

    <!--início cabeçalho-->

    <header>
        <nav class="marginSite flexWrap displayFlex spaceBetween">
            <div class="displayFlex alignCenter">
                <a href="#"><img class="logo" height="60px" src="img/haruo.webp" alt="Logo Galinha"></a> <!--usando logo inventado por enquanto-->
            </div>
            <div class="displayFlex imgCabecalho gap30">
                <a href="https://www.instagram.com/"><img class="imgCabecalho icone" height="40px" src="img/instagram.webp" alt="logo instagram"></a>
                <button id="botaoAgendar" class="botaoHeader">Agendar</button>
            </div>
        </nav>

    <!--fim cabeçalho-->

    </header>


    <!-- carrossel -->

        <div class="carrosselContainer">
        <div class="carrosselSlide">
            <img src="img/banner_um.webp">
            <img src="img/banner_dois.webp">
            <img src="img/banner_tres.webp">
        </div>
        <button id="antBtn" class="carrosselBtn anterior"><</button>
        <button id="proBtn" class="carrosselBtn proximo">></button>
    </div>


    <!--Sessão equipamentos-->

    <main>
        <section class="textoCentro justifyCenter marginSite">
            <h1 class="fonte">Equipamentos disponíveis para locação</h1>
            <div class="displayEquipamentos justifyCenter ">
                <div> <!--Eu ia colocar descrição neles, mas acho melhor pra quando clicar ele abrir a página do equipamento (ou colocar uma animação pra mostrar atrás da imagem)-->
                    <a href="#">
                        <p class="nome">Criofrequência Bodyhealth BHS Full</p>
                        <img class="icone imagens"  src="img/criofrequencia.webp" alt="Criofrequência Bodyhealth BHS Full">
                    </a>
                </div>                
                <div>
                    <a href="#">
                        <p class="nome">Criolipólise Asgard VC10</p>
                        <img class="icone imagens"  src="img/criolipolise.webp" alt="Criolipólise Asgard VC10">
                    </a>
                </div>                
                <div>
                    <a href="#">
                        <p class="nome">Laser Crystal 3D</p>
                        <img class="icone imagens"  src="img/crystal.webp" alt="Laser Crystal 3D">
                    </a>
                </div>                
                <div>
                    <a href="#">
                        <p class="nome">LED Holonyak</p>
                        <img class="icone imagens"  src="img/led.webp" alt="LED Holonyak">
                    </a>
                </div>                
                <div>
                    <a href="#">
                        <p class="nome">Luz Intensa Pulsada Lyra Ibramed</p>
                        <img class="icone imagens"  src="img/luz-pulsada.webp" alt="Luz Intensa Pulsada Lyra Ibramed">
                    </a>
                </div>                
                <div>
                    <a href="#">
                        <p class="nome">Multishape Contouline</p>
                        <img class="icone imagens"  src="img/multishape.webp" alt="Multishape Contouline">
                    </a>
                </div>
            </div>
        </section>

    <!--pop up Agende seu aluguel-->

    <!--coloco numeros no value ou deixo nomes???-->

        <div id="popup" class="popup">
            <div class="popupContent">
            <h3 class="fontePopup">Agendar locação</h3>
            <label class="fontePopup">Cidade:</label>
            <select id="cidade">
                <option value="Atalaia">Atalaia</option>
                <option value="Boa Ventura de São Roque">Boa Ventura de São Roque</option>
                <option value="Campina do Simão">Campina do Simão</option>
                <option value="Candói">Candói</option>
                <option value="Colônia Vitória">Colônia Vitória</option>
                <option value="Entre Rios">Entre Rios</option>
                <option value="Faxinal da Boa Vista">Faxinal da Boa Vista</option>
                <option value="Foz do Jordão">Foz do Jordão</option>
                <option value="Goioxim">Goioxim</option>
                <option value="Guará">Guará</option>
                <option value="Guarapuava">Guarapuava</option>
                <option value="Imbituva">Imbituva</option>
                <option value="Inácio Martins">Inácio Martins</option>
                <option value="Irati">Irati</option>
                <option value="Laranjeiras do Sul">Laranjeiras do Sul</option>
                <option value="Manoel Ribas">Manoel Ribas</option>
                <option value="Mato Rico">Mato Rico</option>
                <option value="Palmeira">Palmeira</option>
                <option value="Palmeirinha">Palmeirinha</option>
                <option value="Pinhão">Pinhão</option>
                <option value="Pitanga">Pitanga</option>
                <option value="Prudentópolis">Prudentópolis</option>
                <option value="Reserva">Reserva</option>
                <option value="Rio Bonito do Iguaçu">Rio Bonito do Iguaçu</option>
                <option value="Santa Maria do Oeste">Santa Maria do Oeste</option>
                <option value="Turvo">Turvo</option>
            </select>

            <label class="fontePopup">Equipamento:</label>
            <select id="maquina">
                <option value="Criofrequência">Criofrequência</option>
                <option value="Criolipólise">Criolipólise</option>
                <option value="Laser Crystal 3D">Laser Crystal 3D</option>
                <option value="LED">LED</option>
                <option value="Luz Pulsada">Luz Pulsada</option>
                <option value="Multishape">Multishape</option>

            </select>

            <label class="fontePopup">Data desejada:</label>
            <input type="date" id="data" min="2025-01-01" max="2025-12-31">

            <button id="enviarZap">Enviar mensagem</button>
            </div>
        </div>


    <footer>
        <section>
            <p> Copyright © 2025 Galinha Locações</p>
        </section>
    </footer>
    <script src="script.js"></script>
</body>
</html>
